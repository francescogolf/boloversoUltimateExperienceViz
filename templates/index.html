<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIZ</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
        }
        #dashboard {
            width: 100%; height: 100%;
            display: grid;
            grid-template-rows: 60% 40%;
            grid-template-columns: 1fr 1fr;
            gap: 4px;
            padding: 4px;
        }
        #trend-container { grid-column: 1 / -1; }
        .chart-box {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="dashboard">
        <div id="trend-container" class="chart-box"></div>
        <div id="ecg-container" class="chart-box"></div>
        <div id="bars-container" class="chart-box"></div>
    </div>
    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
